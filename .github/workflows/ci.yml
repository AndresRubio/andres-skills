name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  issue-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/issue-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict

# claude-pipeline: GitHub lane (spec §6.2). Installed by /claude-pipeline:setup; pinned to {{PLUGIN_REF}}.
name: claude-ship
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # Routing is cheap and has no concurrency group, so no-op events never queue behind (or cancel) a real run.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.target.outputs.run }}
      prompt: ${{ steps.target.outputs.prompt }}
      concurrency: ${{ steps.target.outputs.concurrency }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: {{PLUGIN_REPO_SLUG}}
          ref: {{PLUGIN_REF}}
          path: .claude-pipeline-plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: target
        name: Route the event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(node .claude-pipeline-plugin/{{PLUGIN_SUBDIR}}skills/ship/scripts/pipeline.mjs lane-target --event-file "$GITHUB_EVENT_PATH" --event-name "${{ github.event_name }}" --repo "${{ github.repository }}")
          echo "$out"
          echo "run=$(echo "$out" | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0,"utf8")).run))')" >> "$GITHUB_OUTPUT"
          echo "prompt=$(echo "$out" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).prompt || "")')" >> "$GITHUB_OUTPUT"
          echo "concurrency=$(echo "$out" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).concurrency || "")')" >> "$GITHUB_OUTPUT"

  ship:
    needs: route
    if: needs.route.outputs.run == 'true'
    concurrency:
      group: ${{ needs.route.outputs.concurrency }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      - uses: actions/checkout@v4
        with:
          repository: {{PLUGIN_REPO_SLUG}}
          ref: {{PLUGIN_REF}}
          path: .claude-pipeline-plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the pipeline
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_PIPELINE_LANE: github
          CLAUDE_PIPELINE_GUARD: '1'
          CI: 'true'
          CLAUDE_PIPELINE_HOME: ${{ runner.temp }}/claude-pipeline
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          prompt: ${{ needs.route.outputs.prompt }}
          # The agent loads the pinned checkout above, so its skills, stages and hooks match the CLI it calls.
          # Verify on the first sandbox run that claude-code-action passes --plugin-dir through.
          claude_args: |
            --plugin-dir .claude-pipeline-plugin/{{PLUGIN_SUBDIR}}
            --max-budget-usd 25
            --disallowedTools Bash(gh pr merge:*),Bash(gh pr review:*),Bash(git push --force:*),Bash(git push -f:*)

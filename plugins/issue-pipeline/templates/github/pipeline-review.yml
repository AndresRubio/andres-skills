# issue-pipeline: PR reviewer (spec §7.4, D18). The job and check are both named pipeline-review.
name: pipeline-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: pipeline-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pipeline-review:
    name: pipeline-review
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && startsWith(github.event.pull_request.head.ref, 'pipeline/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: git remote set-head origin --auto
      # Cloned outside the workspace: inside it, the repo's own test runner would collect the plugin's tests.
      - name: Fetch the pinned plugin
        run: git -c advice.detachedHead=false clone --quiet --depth 1 --branch {{PLUGIN_REF}} {{PLUGIN_REPO}} "$RUNNER_TEMP/issue-pipeline-plugin"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the repo's dependencies for the evidence re-run
        run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Review
        uses: anthropics/claude-code-action@v1
        env:
          ISSUE_PIPELINE_LANE: github
          ISSUE_PIPELINE_GUARD: '1'
          CI: 'true'
          ISSUE_PIPELINE_HOME: ${{ runner.temp }}/issue-pipeline
          # claude-code-action ends the run at the session's first result message, and a session that
          # leaves a subagent or a command in the background ends its turn to wait for it. Off, so that
          # every dispatch returns inside its turn.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "claude[bot]"
          prompt: "/issue-pipeline:review ${{ github.event.pull_request.number }} --head ${{ github.event.pull_request.head.sha }}"
          # The agent loads the pinned clone above, so its skills, stages and hooks match the CLI it calls.
          claude_args: |
            --plugin-dir ${{ runner.temp }}/issue-pipeline-plugin/{{PLUGIN_SUBDIR}}
            --model claude-fable-5-1
            --effort high
            --max-budget-usd 15
            --allowedTools "Bash,Read,Write,Glob,Grep"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(git push:*)"
      - name: Verdict → check status
        # Skipped when cancelled: a run cancelled by a newer push must not post a verdict for a superseded head.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/issue-pipeline-plugin/{{PLUGIN_SUBDIR}}skills/ship/scripts/pipeline.mjs" verdict-status --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --head "${{ github.event.pull_request.head.sha }}" --post-missing

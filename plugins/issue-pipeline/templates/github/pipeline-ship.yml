# issue-pipeline: GitHub lane (spec §6.2). Installed by /issue-pipeline:setup; pinned to {{PLUGIN_REF}}.
name: pipeline-ship
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to run (the sweep in pipeline-ready dispatches this)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # Routing is cheap and has no concurrency group, so no-op events never queue behind (or cancel) a real run.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.target.outputs.run }}
      prompt: ${{ steps.target.outputs.prompt }}
      concurrency: ${{ steps.target.outputs.concurrency }}
      key: ${{ steps.target.outputs.key }}
    steps:
      # Cloned outside the workspace: inside it, the repo's own test runner would collect the plugin's tests.
      - name: Fetch the pinned plugin
        run: git -c advice.detachedHead=false clone --quiet --depth 1 --branch {{PLUGIN_REF}} {{PLUGIN_REPO}} "$RUNNER_TEMP/issue-pipeline-plugin"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: target
        name: Route the event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(node "$RUNNER_TEMP/issue-pipeline-plugin/{{PLUGIN_SUBDIR}}skills/ship/scripts/pipeline.mjs" lane-target --event-file "$GITHUB_EVENT_PATH" --event-name "${{ github.event_name }}" --repo "${{ github.repository }}")
          echo "$out"
          echo "run=$(echo "$out" | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0,"utf8")).run))')" >> "$GITHUB_OUTPUT"
          echo "prompt=$(echo "$out" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).prompt || "")')" >> "$GITHUB_OUTPUT"
          echo "concurrency=$(echo "$out" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).concurrency || "")')" >> "$GITHUB_OUTPUT"
          echo "key=$(echo "$out" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).key || "")')" >> "$GITHUB_OUTPUT"

  ship:
    needs: route
    if: needs.route.outputs.run == 'true'
    concurrency:
      group: ${{ needs.route.outputs.concurrency }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git remote set-head origin --auto
      # Cloned outside the workspace: inside it, the repo's own test runner would collect the plugin's tests.
      - name: Fetch the pinned plugin
        run: git -c advice.detachedHead=false clone --quiet --depth 1 --branch {{PLUGIN_REF}} {{PLUGIN_REPO}} "$RUNNER_TEMP/issue-pipeline-plugin"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the pipeline
        uses: anthropics/claude-code-action@v1
        env:
          ISSUE_PIPELINE_LANE: github
          # Recorded per run in run.json (amendment D); keep it equal to --effort in claude_args.
          ISSUE_PIPELINE_EFFORT: high
          ISSUE_PIPELINE_GUARD: '1'
          CI: 'true'
          ISSUE_PIPELINE_HOME: ${{ runner.temp }}/issue-pipeline
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude-code-action takes a comma-separated list. A sweep dispatch made with the default
          # github.token runs as github-actions[bot], which the action refuses unless it is listed.
          allowed_bots: "claude[bot],github-actions[bot]"
          prompt: ${{ needs.route.outputs.prompt }}
          # The agent loads the pinned clone above, so its skills, stages and hooks match the CLI it calls.
          claude_args: |
            --plugin-dir ${{ runner.temp }}/issue-pipeline-plugin/{{PLUGIN_SUBDIR}}
            --effort high
            --max-budget-usd 25
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Skill,Agent,Task,TodoWrite"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr review:*),Bash(git push --force:*),Bash(git push -f:*)"
      # A session can end as a success having done nothing (refused its tools, no login, skill not loaded)
      # or having taken the lock and stopped. Setup creates the run folder before anything else, and
      # every proper ending releases the lock, so the CLI looks for both and parks the issue otherwise.
      - name: Check that the run started and ended properly
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_PIPELINE_HOME: ${{ runner.temp }}/issue-pipeline
          KEY: ${{ needs.route.outputs.key }}
        run: node "$RUNNER_TEMP/issue-pipeline-plugin/{{PLUGIN_SUBDIR}}skills/ship/scripts/pipeline.mjs" ship-status --home "$ISSUE_PIPELINE_HOME" --repo ${{ github.repository }} --key "$KEY" --post-missing

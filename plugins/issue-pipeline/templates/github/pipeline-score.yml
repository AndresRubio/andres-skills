# issue-pipeline: sampled scoring (spec §7.5, D19). pipeline-ready dispatches it for 1 in 4 ready PRs.
# It posts one score comment. It informs and blocks nothing; it is never a required check.
name: pipeline-score
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to score
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: pipeline-score-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  pipeline-score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the input
        env:
          PR: ${{ inputs.pr }}
        run: case "$PR" in ''|*[!0-9]*) exit 1;; esac
      - uses: actions/checkout@v4
      # Cloned outside the workspace: inside it, the repo's own test runner would collect the plugin's tests.
      - name: Fetch the pinned plugin
        run: git -c advice.detachedHead=false clone --quiet --depth 1 --branch {{PLUGIN_REF}} {{PLUGIN_REPO}} "$RUNNER_TEMP/issue-pipeline-plugin"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Score
        uses: anthropics/claude-code-action@v1
        env:
          ISSUE_PIPELINE_GUARD: '1'
          ISSUE_PIPELINE_HOME: ${{ runner.temp }}/issue-pipeline
          # claude-code-action ends the run at the session's first result message, and a session that
          # leaves a subagent or a command in the background ends its turn to wait for it. Off, so that
          # every dispatch returns inside its turn.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # pipeline-ready dispatches this workflow with PIPELINE_TOKEN or, when that secret is unset,
          # the default github.token, which runs as github-actions[bot]. The action refuses a bot it is not told about.
          allowed_bots: "github-actions[bot]"
          prompt: "/issue-pipeline:score ${{ inputs.pr }}"
          claude_args: |
            --plugin-dir ${{ runner.temp }}/issue-pipeline-plugin/{{PLUGIN_SUBDIR}}
            --model haiku
            --effort low
            --max-budget-usd 2
            --allowedTools "Bash,Read,Write,Glob,Grep"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(git push:*),Edit"

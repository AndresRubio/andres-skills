# issue-pipeline: sampled scoring (spec §7.5, D19). pipeline-ready dispatches it for 1 in 4 ready PRs.
# It posts one score comment. It informs and blocks nothing; it is never a required check.
name: pipeline-score
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to score
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: pipeline-score-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  pipeline-score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the input
        env:
          PR: ${{ inputs.pr }}
        run: case "$PR" in ''|*[!0-9]*) exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: {{PLUGIN_REPO_SLUG}}
          ref: {{PLUGIN_REF}}
          path: .issue-pipeline-plugin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Score
        uses: anthropics/claude-code-action@v1
        env:
          ISSUE_PIPELINE_GUARD: '1'
          ISSUE_PIPELINE_HOME: ${{ runner.temp }}/issue-pipeline
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # pipeline-ready dispatches this workflow with PIPELINE_TOKEN or, when that secret is unset,
          # the default github.token, which runs as github-actions[bot]. The action refuses a bot it is not told about.
          allowed_bots: "github-actions[bot]"
          prompt: "/issue-pipeline:score ${{ inputs.pr }}"
          claude_args: |
            --plugin-dir .issue-pipeline-plugin/{{PLUGIN_SUBDIR}}
            --model haiku
            --effort low
            --max-budget-usd 2
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh pr edit:*),Bash(git push:*),Edit"
